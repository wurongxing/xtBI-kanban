<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小铁台球教培经营看板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="cockpit">
      <header class="topbar">
        <section class="brand">
          <img src="./xiaotie-logo.png" alt="小铁台球私教" class="brand-logo" />
          <span class="brand-slogan">愿景：打造最靠谱的智能台球教育平台</span>
          <span class="brand-line">使命：科技赋能、学员得技、教练得益、球房得利</span>
          <span class="brand-line">价值观：践行、精进、共赢、致远</span>
        </section>
        <section class="title-block">
          <h1>小铁台球教培经营看板</h1>
          <div class="subline">
            <span id="periodText">数据周期：2026年7月1日 - 7月31日</span>
            <span id="updatedText">更新于：--</span>
            <span id="syncText">数据同步：内置示例数据</span>
          </div>
        </section>
        <section class="company-summary" aria-label="公司经营总览">
          <div>
            <span>公司总目标</span>
            <strong id="totalGoal">85万</strong>
          </div>
          <div>
            <span>公司总完成</span>
            <strong id="totalCompleted">--</strong>
          </div>
          <div>
            <span>本月时间进度</span>
            <strong id="timeProgress">--</strong>
          </div>
        </section>
      </header>

      <section class="filters" aria-label="时间筛选">
        <button class="chip active" data-view="month">城市经营中心</button>
        <button class="chip" data-view="week">总部运营中心OKR</button>
        <button class="chip" data-view="day">项目进度</button>
        <button class="chip ghost" id="refreshButton">刷新数据</button>
      </section>

      <section class="city-grid city-first">
        <article class="panel city-card" id="shenzhenCard"></article>
        <article class="panel city-card" id="guangzhouCard"></article>
      </section>

      <section class="detail-grid coach-detail-grid">
        <article class="panel">
          <div class="panel-head">
            <h2>全城教练经营排名</h2>
            <span>累计 / 月度 / 昨日 / 续客</span>
          </div>
          <div id="coachBoard" class="coach-board"></div>
        </article>
        <article class="panel ai-panel city-insights-panel">
          <div class="panel-head">
            <h2>经营重点提醒</h2>
            <span>城市负责人每日看</span>
          </div>
          <div class="city-insights" id="aiInsights"></div>
        </article>
      </section>
    </main>

    <aside class="data-dock" aria-label="数据中心">
      <button class="dock-toggle" id="dockToggle" title="数据中心">⚙</button>
      <nav class="dock-menu" id="dockMenu">
        <strong>数据中心</strong>
        <button id="uploadButton">上传Excel数据</button>
        <button id="templateButton">下载Excel模板</button>
        <button id="syncButton">同步数据</button>
        <button id="pngButton">导出PNG图片</button>
        <button id="pdfButton">导出PDF报告</button>
        <button id="settingsButton">系统设置</button>
      </nav>
    </aside>

    <dialog id="syncDialog">
      <form method="dialog" class="dialog-card">
        <h3>数据同步设置</h3>
        <p>线上默认读取 /api/dingtalk-data。也可以填入公开 HTTPS JSON 地址，页面会每30秒自动拉取最新经营与OKR数据。</p>
        <label>
          数据接口
          <input id="endpointInput" type="url" placeholder="留空默认读取 /api/dingtalk-data" />
        </label>
        <menu>
          <button value="cancel">取消</button>
          <button id="saveEndpoint" value="default">保存</button>
        </menu>
      </form>
    </dialog>

    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./vendor/html2canvas.min.js"></script>
    <script src="./vendor/jspdf.umd.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
